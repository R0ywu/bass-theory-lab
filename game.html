<style>
:root{
  --bg:#0f1117;
  --bg2:#161a23;
  --nav:#12151d;
  --card:#1c212e;
  --card2:#232a3a;
  --line:#2e3648;
  --line2:#3a4358;
  --text:#e8ecf4;
  --body:#cdd4e2;
  --muted:#9aa3b5;
  --accent:#f5a623;
  --accent2:#4fc3f7;
  --green:#66d9a3;
  --red:#ef6d6d;
  --purple:#b78cf7;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.75;
  font-size:16px;
  counter-reset:sec;
}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== top nav ===== */
.topnav{
  position:sticky;top:0;z-index:50;
  background:rgba(18,21,29,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
  padding:12px 18px;flex-wrap:wrap;
}
.topnav .brand{font-weight:900;color:var(--accent);white-space:nowrap;font-size:15px;display:flex;align-items:center;gap:8px}
.topnav .links{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.topnav a.chip{
  color:var(--muted);font-size:13px;padding:5px 10px;border-radius:8px;white-space:nowrap;
}
.topnav a.chip:hover{background:var(--card);color:var(--text);text-decoration:none}
.topnav a.chip.active{background:var(--accent);color:#141414;font-weight:700}
/* 章節進度細條 */
.chprogress{position:sticky;top:0;height:3px;background:var(--card2);z-index:51}
.chprogress>div{height:3px;background:linear-gradient(90deg,var(--accent),#ffc75e)}

/* ===== layout ===== */
.wrap{max-width:1000px;margin:0 auto;padding:28px 20px 90px}
.wrap.with-rail{max-width:1280px;display:flex;gap:32px;align-items:flex-start}
.wrap.with-rail>.main{flex:1;min-width:0}

/* 右側目錄欄 */
.toc-rail{width:250px;flex-shrink:0;position:sticky;top:76px}
.toc-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px 16px 16px}
.toc-box .toc-head{font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-bottom:10px}
.toc-box a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:13.5px;color:var(--muted)}
.toc-box a:hover{color:var(--text);text-decoration:none;background:var(--card2)}
.toc-box a .dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0}
.toc-box a.done{color:var(--green)}
.toc-box a.done .dot{border-color:var(--green);background:radial-gradient(circle,var(--green) 40%,transparent 45%)}
.toc-box a.now{background:rgba(245,166,35,.13);color:var(--accent);font-weight:900}
.toc-box a.now .dot{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 40%,transparent 45%)}
@media (max-width:1080px){.toc-rail{display:none}.wrap.with-rail{max-width:1000px}}

/* ===== hero ===== */
.hero{padding:30px 0 6px}
.hero .kicker-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero .chbadge{font-size:13px;letter-spacing:3px;color:var(--accent);font-weight:900}
.hero .kicker{color:var(--muted);font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 10px}
.hero h1{font-size:36px;margin:10px 0 10px;line-height:1.3;font-weight:900}
.hero p.lead{color:var(--muted);max-width:720px}
.learn-box{
  margin-top:16px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:13px 18px;font-size:14px;color:var(--muted);
  border-left:4px solid var(--green);
}
.learn-box b{color:var(--text)}

/* ===== sections ===== */
section.lesson{margin-top:48px}
section.lesson h2{
  font-size:23px;border-left:4px solid var(--accent);padding-left:14px;margin-bottom:14px;
  display:flex;align-items:baseline;gap:12px;font-weight:900;
}
section.lesson h2::before{
  counter-increment:sec;
  content:counter(sec,decimal-leading-zero);
  font-size:13px;color:var(--accent);font-weight:900;letter-spacing:1px;
  font-family:ui-monospace,Menlo,Consolas,monospace;
}
section.lesson h3{font-size:17px;margin:24px 0 8px;color:var(--accent2)}
section.lesson p{margin:10px 0;color:var(--body)}
section.lesson p b,section.lesson li b{color:var(--text)}
.note{
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent2);
  border-radius:10px;padding:12px 16px;margin:14px 0;font-size:14.5px;color:var(--muted);
}
.note.warn{border-left-color:var(--accent)}
.note b{color:var(--text)}

/* ===== interactive panel ===== */
.panel{
  background:linear-gradient(180deg,#1e2432,#1a1f2b);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin:20px 0;overflow-x:auto;
}
.panel .panel-title{
  font-weight:900;display:flex;align-items:center;gap:11px;font-size:15.5px;
  margin:-18px -18px 16px;padding:12px 18px;
  border-bottom:1px solid var(--line);
  background:rgba(245,166,35,.05);
  border-radius:var(--radius) var(--radius) 0 0;
}
.panel .panel-title::before{
  content:"▶";color:#141414;font-size:11px;
  background:var(--accent);width:30px;height:30px;border-radius:9px;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
}
.panel .panel-title::after{
  content:"互動・有聲";
  font-size:11px;font-weight:700;color:var(--accent2);
  border:1px solid rgba(79,195,247,.4);border-radius:6px;
  padding:1px 9px;letter-spacing:1px;white-space:nowrap;
}
.panel .hint{
  font-size:13px;color:var(--muted);margin-top:12px;
  background:rgba(79,195,247,.06);border:1px solid rgba(79,195,247,.18);
  border-radius:9px;padding:9px 14px;line-height:1.7;
}

/* controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
button.btn{
  background:var(--accent);color:#141414;border:none;border-radius:11px;
  padding:10px 20px;font-size:14.5px;font-weight:900;cursor:pointer;
  font-family:inherit;transition:transform .08s, filter .15s;
}
button.btn:hover{filter:brightness(1.1)}
button.btn:active{transform:scale(.96)}
button.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line);font-weight:700}
button.btn.small{padding:6px 13px;font-size:13px;font-weight:700}
button.btn.toggled{background:var(--accent2);color:#08222e}
select.sel,input.inp{
  background:var(--card2);color:var(--text);border:1px solid var(--line2);
  border-radius:9px;padding:8px 12px;font-size:14px;font-family:inherit;font-weight:700;
}
label.ctl{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
input[type=range]{accent-color:var(--accent)}

/* seg buttons */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{
  background:var(--card2);color:var(--muted);border:1px solid var(--line);
  border-radius:9px;padding:8px 15px;font-size:13.5px;cursor:pointer;font-family:inherit;
  min-height:36px;
}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#141414;font-weight:900}

/* ===== tables ===== */
table.tbl{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
table.tbl th{
  background:var(--card2);color:var(--accent);text-align:left;
  padding:9px 12px;border:1px solid var(--line);white-space:nowrap;
}
table.tbl td{padding:8px 12px;border:1px solid var(--line);color:var(--body)}
table.tbl tr.hl td{background:rgba(245,166,35,.13)}
table.tbl td .play-ico{cursor:pointer;color:var(--accent);font-weight:700}

/* badge */
.badge{
  display:inline-block;background:var(--card2);border:1px solid var(--line);
  border-radius:6px;padding:1px 8px;font-size:12.5px;color:var(--accent2);margin:0 2px;
  font-family:ui-monospace,Menlo,Consolas,monospace;
}
.formula{
  font-family:ui-monospace,Menlo,Consolas,monospace;
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:9px 16px;display:inline-block;margin:6px 0;font-size:15px;color:var(--accent);
  letter-spacing:1.5px;
}

/* ===== quiz ===== */
.quiz-q{font-weight:700;margin-bottom:10px}
.quiz-opts{display:flex;gap:8px;flex-wrap:wrap}
.quiz-opts button{min-width:64px}
.quiz-fb{margin-top:10px;font-size:14.5px;min-height:22px}
.quiz-fb.ok{color:var(--green)}
.quiz-fb.no{color:var(--red)}
.score{font-size:13px;color:var(--muted);margin-top:6px}

/* footer nav */
.pagenav{
  display:flex;justify-content:space-between;gap:12px;margin-top:60px;
  border-top:1px solid var(--line);padding-top:22px;
}
.pagenav a{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 18px;color:var(--text);max-width:46%;
}
.pagenav a:hover{border-color:var(--accent);text-decoration:none;transform:translateY(-2px);transition:all .12s}
.pagenav .dir{font-size:12px;color:var(--muted)}
.pagenav .ttl{font-weight:700;font-size:14.5px}

/* svg instrument shared */
.instrument{width:100%;overflow-x:auto;padding:4px 0}
.instrument svg{display:block;margin:0 auto}
svg text{user-select:none;-webkit-user-select:none}
.instrument svg text{pointer-events:none}
.clickable{cursor:pointer}

/* ===== index 首頁 ===== */
.home-hero{padding:52px 0 30px;position:relative}
.home-hero .kicker{color:var(--accent);font-weight:700;letter-spacing:4px;font-size:13px}
.home-hero h1{font-size:44px;margin:12px 0 14px;line-height:1.3;font-weight:900}
.home-hero p.lead{color:var(--muted);max-width:640px;font-size:16.5px}
.home-cta{display:flex;gap:14px;align-items:center;margin-top:28px;flex-wrap:wrap}
.home-cta .cta{
  background:var(--accent);color:#141414;font-weight:900;font-size:15.5px;
  padding:13px 26px;border-radius:12px;display:inline-flex;align-items:center;gap:9px;
}
.home-cta .cta:hover{text-decoration:none;filter:brightness(1.08)}
.home-cta .cta.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);font-weight:700}
.home-stats{display:flex;gap:26px;margin-left:auto}
.home-stats .st{text-align:center}
.home-stats .st .n{font-size:26px;font-weight:900;line-height:1.3}
.home-stats .st .l{font-size:12px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px;margin-top:20px}
.card-link{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px;color:var(--text);display:flex;flex-direction:column;gap:8px;
  transition:transform .12s,border-color .15s;
}
.card-link:hover{transform:translateY(-3px);border-color:var(--accent);text-decoration:none}
.card-link .toprow{display:flex;justify-content:space-between;align-items:center}
.card-link .num{color:var(--accent);font-weight:900;font-size:12px;letter-spacing:2px}
.card-link .lv{font-size:11px;border-radius:6px;padding:2px 8px}
.card-link .lv.a{color:var(--green);background:rgba(102,217,163,.12)}
.card-link .lv.b{color:var(--accent2);background:rgba(79,195,247,.12)}
.card-link .lv.c{color:var(--muted);background:var(--card2)}
.card-link .lv.d{color:var(--purple);background:rgba(183,140,247,.12)}
.card-link h3{margin:0;font-size:16.5px}
.card-link p{color:var(--muted);font-size:13px;line-height:1.6;flex:1}
.card-link .prog{height:4px;border-radius:2px;background:var(--card2);margin-top:4px}
.card-link .prog>div{height:4px;border-radius:2px;background:var(--accent);width:0}

.path-box{margin-top:36px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 30px}
.path-box h2{font-size:18px;font-weight:900;margin-bottom:18px}
.path-row{display:flex;flex-wrap:wrap;gap:16px 0}
.path-row .step{flex:1;min-width:200px;border-left:3px solid var(--accent);padding:2px 18px 2px 14px}
.path-row .step .wk{font-size:12px;color:var(--accent);font-weight:700}
.path-row .step .t{font-size:14px;font-weight:700;margin-top:2px}
.path-row .step .d{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.6}
.path-row .step.blue{border-left-color:var(--accent2)}
.path-row .step.blue .wk{color:var(--accent2)}
.path-row .step.green{border-left-color:var(--green)}
.path-row .step.green .wk{color:var(--green)}

/* misc */
.center{text-align:center}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.acc{color:var(--accent)}
.acc2{color:var(--accent2)}
.big-num{font-size:40px;font-weight:800;color:var(--accent);line-height:1.2}
.flexrow{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.flexrow>div{flex:1;min-width:260px}
@media (max-width:640px){
  .hero h1{font-size:26px}
  .home-hero h1{font-size:30px}
  body{font-size:15px}
  .home-stats{margin-left:0}
}

</style>

<style>
/* ===== 闖關模式專用樣式 ===== */
.g-hero{padding:34px 0 8px}
.g-hero h1{font-size:34px;font-weight:900;margin:8px 0}
.g-hero .kicker{color:var(--accent);font-weight:700;letter-spacing:3px;font-size:13px}
.g-stats{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0 6px}
.g-stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 20px;display:flex;align-items:center;gap:12px}
.g-stat .n{font-size:22px;font-weight:900;color:var(--accent)}
.g-stat .l{font-size:12px;color:var(--muted)}
.g-stat.title-card .n{color:var(--accent2);font-size:18px}
.g-xpbar{flex:1;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 20px}
.g-xpbar .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.g-xpbar .bar{height:8px;border-radius:4px;background:var(--card2)}
.g-xpbar .bar>div{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent),#ffc75e)}

.g-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-top:22px}
.g-lv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;position:relative;transition:transform .1s,border-color .15s}
.g-lv:hover{transform:translateY(-2px);border-color:var(--accent)}
.g-lv.locked{opacity:.45;cursor:not-allowed}
.g-lv.locked:hover{transform:none;border-color:var(--line)}
.g-lv .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.g-lv .no{font-size:12px;font-weight:900;letter-spacing:2px;color:var(--accent)}
.g-lv .type{font-size:11px;border-radius:6px;padding:2px 8px;font-weight:700}
.g-lv .type.hunt{color:var(--accent2);background:rgba(79,195,247,.12)}
.g-lv .type.ear{color:var(--purple);background:rgba(183,140,247,.12)}
.g-lv .type.rhythm{color:var(--green);background:rgba(102,217,163,.12)}
.g-lv h3{font-size:15.5px;margin:0 0 4px}
.g-lv .sub{font-size:12px;color:var(--muted);line-height:1.5;min-height:36px}
.g-lv .stars{font-size:16px;letter-spacing:2px;margin-top:8px}
.g-lv .stars .on{color:var(--accent)}
.g-lv .stars .off{color:var(--card2)}

/* 遊玩區 */
#g-play{display:none}
.g-playhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:20px 0 14px}
.g-playhead .back{cursor:pointer;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:14px;color:var(--text)}
.g-playhead h2{font-size:22px;font-weight:900;margin:0}
.g-hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
.g-chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:14px;font-weight:700}
.g-chip b{color:var(--accent)}
.g-chip.time b{font-family:ui-monospace,Menlo,monospace;font-size:17px}
.g-arena{background:linear-gradient(180deg,#1e2432,#1a1f2b);border:1px solid var(--line);border-radius:16px;padding:22px;min-height:260px}
.g-msg{font-size:15px;margin:12px 0;min-height:24px;font-weight:700}
.g-msg.ok{color:var(--green)}
.g-msg.no{color:var(--red)}
.g-bigplay{display:flex;justify-content:center;margin:14px 0}
.g-tap{
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background:var(--accent);color:#141414;font-size:22px;font-weight:900;
  border:none;border-radius:18px;width:100%;max-width:420px;height:130px;cursor:pointer;
  font-family:inherit;transition:transform .05s;
}
.g-tap:active{transform:scale(.97)}
.g-feedback{text-align:center;font-size:30px;font-weight:900;min-height:44px;margin-top:10px}
.g-result{text-align:center;padding:30px 10px}
.g-result .big{font-size:52px;letter-spacing:6px}
.g-result .big .on{color:var(--accent)}
.g-result .big .off{color:var(--card2)}
.g-result h3{font-size:24px;margin:10px 0 4px}
.g-result p{color:var(--muted)}
.g-hearts{font-size:20px;letter-spacing:3px}
.g-dots{display:flex;gap:6px;align-items:center}

<script>
/* ================= BassLab 共用引擎 =================
   音訊合成（貝斯 / 鋼琴音色）、鋼琴鍵盤與貝斯指板元件、播放排程
====================================================== */
"use strict";

/* ---------- 音名工具 ---------- */
const NOTE_NAMES_SHARP = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const NOTE_NAMES_FLAT  = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
function midiToName(m, flat){ return (flat?NOTE_NAMES_FLAT:NOTE_NAMES_SHARP)[((m%12)+12)%12]; }
function midiToNameOct(m, flat){ return midiToName(m,flat) + (Math.floor(m/12)-1); }
function midiToFreq(m){ return 440 * Math.pow(2,(m-69)/12); }
function nameToPc(name){
  const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  let pc = base[name[0]];
  for(let i=1;i<name.length;i++){ if(name[i]==="#")pc++; if(name[i]==="b")pc--; }
  return ((pc%12)+12)%12;
}

/* ---------- 音訊引擎 ---------- */
const AudioEngine = (() => {
  let ctx = null, master = null, silentEl = null;
  /* iOS Safari：Web Audio 預設走「鈴聲」音訊類別，手機切靜音就完全無聲。
     播放一個無聲的 <audio>（媒體類別）可把整頁音訊切到「媒體播放」，
     靜音鍵就不會蓋掉聲音。 */
  const SILENT_WAV="data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YSADAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==";
  function iosUnlock(){
    try{
      if(!silentEl){
        silentEl=document.createElement("audio");
        silentEl.setAttribute("playsinline","");
        silentEl.loop=true;
        silentEl.src=SILENT_WAV;
      }
      if(silentEl.paused) silentEl.play().catch(()=>{});
    }catch(e){}
  }
  function ensure(){
    if(!ctx){
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.9;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6;
      master.connect(comp); comp.connect(ctx.destination);
    }
    iosUnlock();
    if(ctx.state!=="running"){ try{ctx.resume();}catch(e){} }
    return ctx;
  }
  /* iOS：來電、切換 App 或鎖屏後音訊會被中斷，回到頁面／再次觸碰時自動恢復 */
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden && ctx && ctx.state!=="running"){ try{ctx.resume();}catch(e){} }
  });
  ["touchend","click"].forEach(evt=>{
    document.addEventListener(evt,()=>{
      if(ctx){ iosUnlock(); if(ctx.state!=="running"){ try{ctx.resume();}catch(e){} } }
    },{passive:true});
  });
  /* 貝斯撥弦音色：saw+sub sine、低通濾波、快速起音長衰減 */
  function bass(midi, when, dur, vel){
    const c = ensure();
    const t = (when===undefined||when===null)? c.currentTime+0.02 : when;
    dur = dur || 0.9; vel = vel===undefined?1:vel;
    const f = midiToFreq(midi);
    const o1 = c.createOscillator(); o1.type="sawtooth"; o1.frequency.value=f;
    const o2 = c.createOscillator(); o2.type="sine"; o2.frequency.value=f;
    const o3 = c.createOscillator(); o3.type="square"; o3.frequency.value=f*2; // 泛音一點點
    const g1=c.createGain(), g2=c.createGain(), g3=c.createGain();
    g1.gain.value=0.5; g2.gain.value=0.85; g3.gain.value=0.06;
    const filt=c.createBiquadFilter(); filt.type="lowpass"; filt.Q.value=2;
    filt.frequency.setValueAtTime(Math.min(f*9,3200), t);
    filt.frequency.exponentialRampToValueAtTime(Math.max(f*1.6,120), t+Math.min(dur*0.75,0.7));
    const amp=c.createGain();
    const peak=0.5*vel;
    amp.gain.setValueAtTime(0.0001,t);
    amp.gain.exponentialRampToValueAtTime(peak, t+0.012);
    amp.gain.exponentialRampToValueAtTime(peak*0.5, t+Math.min(0.25,dur*0.4));
    amp.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o1.connect(g1); o2.connect(g2); o3.connect(g3);
    g1.connect(filt); g3.connect(filt); filt.connect(amp); g2.connect(amp);
    amp.connect(master);
    [o1,o2,o3].forEach(o=>{o.start(t); o.stop(t+dur+0.05);});
  }
  /* 鋼琴風音色：多泛音三角波 + 衰減 */
  function piano(midi, when, dur, vel){
    const c = ensure();
    const t = (when===undefined||when===null)? c.currentTime+0.02 : when;
    dur = dur || 1.1; vel = vel===undefined?1:vel;
    const f = midiToFreq(midi);
    const amp=c.createGain();
    const peak=0.30*vel;
    amp.gain.setValueAtTime(0.0001,t);
    amp.gain.exponentialRampToValueAtTime(peak,t+0.008);
    amp.gain.exponentialRampToValueAtTime(peak*0.35,t+Math.min(0.35,dur*0.5));
    amp.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    amp.connect(master);
    const partials=[[1,1],[2,0.4],[3,0.18],[4,0.09],[5,0.05]];
    partials.forEach(([n,g])=>{
      if(f*n>9000)return;
      const o=c.createOscillator();
      o.type = n===1 ? "triangle" : "sine";
      o.frequency.value=f*n;
      const og=c.createGain(); og.gain.value=g;
      o.connect(og); og.connect(amp);
      o.start(t); o.stop(t+dur+0.05);
    });
  }
  /* 節拍器 click */
  function click(when, accent){
    const c = ensure();
    const t = (when===undefined||when===null)? c.currentTime+0.02 : when;
    const o=c.createOscillator(); o.type="square";
    o.frequency.value = accent? 1550: 990;
    const g=c.createGain();
    const pk = accent? 0.4: 0.22;
    g.gain.setValueAtTime(pk,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+0.09);
  }
  function drum(when, kind){ // kick / snare 簡易
    const c=ensure();
    const t=(when===undefined||when===null)?c.currentTime+0.02:when;
    if(kind==="kick"){
      const o=c.createOscillator(); o.type="sine";
      o.frequency.setValueAtTime(140,t);
      o.frequency.exponentialRampToValueAtTime(45,t+0.12);
      const g=c.createGain();
      g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+0.25);
    }else{
      const len=c.sampleRate*0.15;
      const buf=c.createBuffer(1,len,c.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
      const src=c.createBufferSource(); src.buffer=buf;
      const bp=c.createBiquadFilter(); bp.type="highpass"; bp.frequency.value=1800;
      const g=c.createGain(); g.gain.value=0.5;
      src.connect(bp); bp.connect(g); g.connect(master); src.start(t);
    }
  }
  function now(){ return ensure().currentTime; }
  return { bass, piano, click, drum, now, ensure };
})();

/* ---------- 排程器：播放序列並同步視覺 ----------
   events: [{time(秒,相對), dur, fn(播放函式), hl(視覺callback)}]
   回傳 stop()                                          */
const Player = (()=>{
  let timers=[]; let active=false;
  function stop(){
    timers.forEach(id=>clearTimeout(id));
    timers=[]; active=false;
    document.querySelectorAll(".is-playing-btn").forEach(b=>b.classList.remove("is-playing-btn"));
  }
  function play(events, onDone){
    stop();
    active=true;
    const t0 = AudioEngine.now()+0.08;
    let end=0;
    events.forEach(ev=>{
      if(ev.fn) ev.fn(t0+ev.time);
      if(ev.hl){
        timers.push(setTimeout(()=>{ if(active) ev.hl(); }, Math.max(0,(ev.time)*1000+80)));
      }
      end=Math.max(end, ev.time+(ev.dur||0.5));
    });
    timers.push(setTimeout(()=>{ active=false; if(onDone)onDone(); }, end*1000+300));
    return stop;
  }
  return {play, stop, isActive:()=>active};
})();

/* ---------- 鋼琴鍵盤元件 ----------
   makePiano(el, opts)
   opts: startMidi(白鍵起點,建議C), octaves, onClick(midi), showLabels("none"|"white"|"all"|"letter")
   回傳 api: highlight(map: midi->{color,label}), clear(), flash(midi), rootStyle
------------------------------------------------- */
function makePiano(el, opts){
  opts=opts||{};
  const octaves=opts.octaves||2;
  const startMidi=opts.startMidi||48; // C3
  const showLabels=opts.showLabels||"white";
  const keyW=opts.keyW||44, keyH=opts.keyH||150;
  const nWhite=octaves*7+1;
  const W=nWhite*keyW+2, H=keyH+34;
  const svgNS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.setAttribute("width",Math.min(W, 900));
  el.classList.add("instrument");
  el.appendChild(svg);
  const whitePcs=[0,2,4,5,7,9,11];
  const keys=[]; // {midi, rect, label, isBlack, baseFill}
  // 白鍵
  let wi=0;
  const total=octaves*12+1;
  for(let i=0;i<total;i++){
    const midi=startMidi+i;
    if(whitePcs.includes(midi%12)){
      const x=wi*keyW;
      const r=document.createElementNS(svgNS,"rect");
      r.setAttribute("x",x+1);r.setAttribute("y",1);
      r.setAttribute("width",keyW-2);r.setAttribute("height",keyH);
      r.setAttribute("rx",4);
      r.setAttribute("fill","#f2f2f0");r.setAttribute("stroke","#999");
      r.classList.add("clickable");
      svg.appendChild(r);
      const t=document.createElementNS(svgNS,"text");
      t.setAttribute("x",x+keyW/2);t.setAttribute("y",keyH-10);
      t.setAttribute("text-anchor","middle");t.setAttribute("font-size","13");
      t.setAttribute("fill","#555");t.setAttribute("font-weight","600");
      t.textContent=(showLabels==="white"||showLabels==="all")?midiToName(midi):"";
      svg.appendChild(t);
      const sub=document.createElementNS(svgNS,"text");
      sub.setAttribute("x",x+keyW/2);sub.setAttribute("y",keyH+22);
      sub.setAttribute("text-anchor","middle");sub.setAttribute("font-size","12");
      sub.setAttribute("fill","var(--accent)");sub.setAttribute("font-weight","700");
      svg.appendChild(sub);
      keys.push({midi,rect:r,label:t,sub,isBlack:false,baseFill:"#f2f2f0"});
      wi++;
    }
  }
  // 黑鍵
  wi=0;
  for(let i=0;i<total;i++){
    const midi=startMidi+i;
    if(whitePcs.includes(midi%12)){ wi++; continue; }
    const x=wi*keyW - keyW*0.32;
    const r=document.createElementNS(svgNS,"rect");
    r.setAttribute("x",x);r.setAttribute("y",1);
    r.setAttribute("width",keyW*0.64);r.setAttribute("height",keyH*0.62);
    r.setAttribute("rx",3);
    r.setAttribute("fill","#1c1c22");r.setAttribute("stroke","#000");
    r.classList.add("clickable");
    svg.appendChild(r);
    const t=document.createElementNS(svgNS,"text");
    t.setAttribute("x",x+keyW*0.32);t.setAttribute("y",keyH*0.62-8);
    t.setAttribute("text-anchor","middle");t.setAttribute("font-size","10");
    t.setAttribute("fill","#bbb");
    t.textContent=(showLabels==="all")?midiToName(midi):"";
    svg.appendChild(t);
    const sub=document.createElementNS(svgNS,"text");
    sub.setAttribute("x",x+keyW*0.32);sub.setAttribute("y",keyH*0.62-22);
    sub.setAttribute("text-anchor","middle");sub.setAttribute("font-size","11");
    sub.setAttribute("fill","#ffd479");sub.setAttribute("font-weight","700");
    svg.appendChild(sub);
    keys.push({midi,rect:r,label:t,sub,isBlack:true,baseFill:"#1c1c22"});
  }
  const byMidi={}; keys.forEach(k=>byMidi[k.midi]=k);
  function flash(midi,color){
    const k=byMidi[midi]; if(!k)return;
    const prev=k.rect.getAttribute("fill");
    k.rect.setAttribute("fill",color||"#f5a623");
    setTimeout(()=>{ k.rect.setAttribute("fill", k._hold || k.baseFill); },260);
  }
  keys.forEach(k=>{
    k.rect.addEventListener("pointerdown",()=>{
      AudioEngine.piano(k.midi);
      flash(k.midi,"#f5a623");
      if(opts.onClick)opts.onClick(k.midi);
    });
  });
  function clear(){
    keys.forEach(k=>{ k._hold=null; k.rect.setAttribute("fill",k.baseFill); k.sub.textContent=""; });
  }
  function highlight(map){ // {midi: {color,label}}
    clear();
    Object.keys(map).forEach(m=>{
      const k=byMidi[m]; if(!k)return;
      const conf=map[m];
      k._hold=conf.color|| (k.isBlack? "#c07f1a":"#ffd479");
      k.rect.setAttribute("fill",k._hold);
      if(conf.label!==undefined) k.sub.textContent=conf.label;
    });
  }
  return {highlight, clear, flash, keys, byMidi, svg};
}

/* ---------- 貝斯指板元件 ----------
   makeFretboard(el, opts)
   opts: frets, onClick(midi,string,fret), showNames("none"|"natural"|"all"), height
   四弦: 由上而下 G D A E（同 TAB）
   回傳 api: highlight(list:[{string(0=G..3=E)|midi, fret, color, label}]), byPos, clear, flash
------------------------------------------------- */
const OPEN_STRINGS=[31,26,21,16]; // 反過來顯示: G2? -> 實際 bass: E1=28? 標準四弦貝斯 E1(41Hz)=MIDI28, A1=33, D2=38, G2=43
// 由上而下 G D A E:
const BASS_OPEN=[43,38,33,28];
const BASS_STRING_NAMES=["G","D","A","E"];
function makeFretboard(el, opts){
  opts=opts||{};
  const frets=opts.frets||12;
  const showNames=opts.showNames||"none";
  const nutW=46, fretW=opts.fretW||62, rowH=40, padT=26, padB=30, padL=8;
  const W=padL+nutW+frets*fretW+14, H=padT+rowH*3+padB+22;
  const svgNS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.setAttribute("width",Math.min(W,940));
  el.classList.add("instrument");
  el.appendChild(svg);
  // 指板底
  const board=document.createElementNS(svgNS,"rect");
  board.setAttribute("x",padL+nutW);board.setAttribute("y",padT-14);
  board.setAttribute("width",frets*fretW);board.setAttribute("height",rowH*3+28);
  board.setAttribute("fill","#3a2a1c");board.setAttribute("rx",4);
  svg.appendChild(board);
  // 琴枕
  const nut=document.createElementNS(svgNS,"rect");
  nut.setAttribute("x",padL+nutW-5);nut.setAttribute("y",padT-14);
  nut.setAttribute("width",6);nut.setAttribute("height",rowH*3+28);
  nut.setAttribute("fill","#d8d3c5");
  svg.appendChild(nut);
  // 琴格線
  for(let f=1;f<=frets;f++){
    const x=padL+nutW+f*fretW;
    const l=document.createElementNS(svgNS,"line");
    l.setAttribute("x1",x);l.setAttribute("y1",padT-14);
    l.setAttribute("x2",x);l.setAttribute("y2",padT+rowH*3+14);
    l.setAttribute("stroke","#6e5a41");l.setAttribute("stroke-width",2.5);
    svg.appendChild(l);
    // 格數字
    const t=document.createElementNS(svgNS,"text");
    t.setAttribute("x",x-fretW/2);t.setAttribute("y",H-6);
    t.setAttribute("text-anchor","middle");t.setAttribute("font-size","12");
    t.setAttribute("fill","#8a93a5");
    t.textContent=f;
    svg.appendChild(t);
  }
  // 定位點
  [3,5,7,9].forEach(f=>{
    const c=document.createElementNS(svgNS,"circle");
    c.setAttribute("cx",padL+nutW+(f-0.5)*fretW);
    c.setAttribute("cy",padT+rowH*1.5);
    c.setAttribute("r",5.5);c.setAttribute("fill","#8b775e");
    svg.appendChild(c);
  });
  if(frets>=12){
    [padT+rowH*0.5,padT+rowH*2.5].forEach(cy=>{
      const c=document.createElementNS(svgNS,"circle");
      c.setAttribute("cx",padL+nutW+11.5*fretW);
      c.setAttribute("cy",cy);
      c.setAttribute("r",5.5);c.setAttribute("fill","#8b775e");
      svg.appendChild(c);
    });
  }
  // 弦
  for(let s=0;s<4;s++){
    const y=padT+s*rowH;
    const l=document.createElementNS(svgNS,"line");
    l.setAttribute("x1",padL+nutW-5);l.setAttribute("y1",y);
    l.setAttribute("x2",padL+nutW+frets*fretW);l.setAttribute("y2",y);
    l.setAttribute("stroke","#cfc8b8");l.setAttribute("stroke-width",1.4+s*0.9);
    svg.appendChild(l);
    // 弦名
    const t=document.createElementNS(svgNS,"text");
    t.setAttribute("x",padL+14);t.setAttribute("y",y+5);
    t.setAttribute("text-anchor","middle");t.setAttribute("font-size","15");
    t.setAttribute("font-weight","700");
    t.setAttribute("fill", "#f5a623");
    t.textContent=BASS_STRING_NAMES[s];
    svg.appendChild(t);
  }
  // 音位（含 open=fret0）
  const cells={}; // key "s_f" -> {circle,text,midi}
  for(let s=0;s<4;s++){
    for(let f=0;f<=frets;f++){
      const midi=BASS_OPEN[s]+f;
      const cx = f===0? padL+nutW-16 : padL+nutW+(f-0.5)*fretW;
      const cy = padT+s*rowH;
      const g=document.createElementNS(svgNS,"g");
      g.classList.add("clickable");
      const c=document.createElementNS(svgNS,"circle");
      c.setAttribute("cx",cx);c.setAttribute("cy",cy);c.setAttribute("r",13.5);
      c.setAttribute("fill","transparent");
      c.setAttribute("stroke","transparent");
      const t=document.createElementNS(svgNS,"text");
      t.setAttribute("x",cx);t.setAttribute("y",cy+4);
      t.setAttribute("text-anchor","middle");t.setAttribute("font-size","11.5");
      t.setAttribute("font-weight","700");t.setAttribute("fill","transparent");
      const nm=midiToName(midi);
      if(showNames==="all" || (showNames==="natural" && nm.length===1)){
        c.setAttribute("fill","rgba(255,255,255,0.10)");
        t.setAttribute("fill","#e8ecf4"); t.textContent=nm;
      }
      g.appendChild(c);g.appendChild(t);
      svg.appendChild(g);
      const cell={circle:c,text:t,midi,s,f,baseShown:(showNames==="all"||(showNames==="natural"&&nm.length===1))};
      cells[s+"_"+f]=cell;
      g.addEventListener("pointerdown",()=>{
        AudioEngine.bass(midi);
        flashCell(cell);
        if(opts.onClick)opts.onClick(midi,s,f);
      });
    }
  }
  function flashCell(cell,color){
    const pc=cell.circle.getAttribute("fill"), pt=cell.text.getAttribute("fill"), ptxt=cell.text.textContent;
    cell.circle.setAttribute("fill",color||"#f5a623");
    cell.text.setAttribute("fill","#141414");
    cell.text.textContent=midiToName(cell.midi);
    setTimeout(()=>{
      if(cell._hold){ applyHold(cell); }
      else{
        cell.circle.setAttribute("fill",pc==="#f5a623"?"transparent":pc);
        cell.text.setAttribute("fill",pt);
        cell.text.textContent=ptxt;
      }
    },280);
  }
  function applyHold(cell){
    cell.circle.setAttribute("fill",cell._hold.color);
    cell.circle.setAttribute("stroke",cell._hold.stroke||"transparent");
    cell.circle.setAttribute("stroke-width",2.5);
    cell.text.setAttribute("fill",cell._hold.tcolor||"#141414");
    cell.text.textContent=cell._hold.label!==undefined?cell._hold.label:midiToName(cell.midi);
  }
  function clear(){
    Object.values(cells).forEach(cell=>{
      cell._hold=null;
      const nm=midiToName(cell.midi);
      if(cell.baseShown){
        cell.circle.setAttribute("fill","rgba(255,255,255,0.10)");
        cell.text.setAttribute("fill","#e8ecf4");cell.text.textContent=nm;
      }else{
        cell.circle.setAttribute("fill","transparent");
        cell.text.setAttribute("fill","transparent");
      }
      cell.circle.setAttribute("stroke","transparent");
    });
  }
  function highlight(list){
    clear();
    list.forEach(item=>{
      const cell=cells[item.string+"_"+item.fret];
      if(!cell)return;
      cell._hold={color:item.color||"#f5a623",label:item.label,tcolor:item.tcolor,stroke:item.stroke};
      applyHold(cell);
    });
  }
  function flashPos(s,f,color){ const cell=cells[s+"_"+f]; if(cell)flashCell(cell,color); }
  return {highlight,clear,flashPos,cells,svg,frets};
}

/* 在指板上找音（優先低把位）：回傳 {string,fret,midi} */
function findOnFretboard(midi, maxFret){
  maxFret=maxFret||12;
  for(let s=3;s>=0;s--){ // 從 E 弦(最低)找
    const f=midi-BASS_OPEN[s];
    if(f>=0&&f<=maxFret) return {string:s,fret:f,midi};
  }
  return null;
}
/* 音階在指板上的所有位置 */
function scaleOnFretboard(rootPc, intervals, maxFret){
  maxFret=maxFret||12;
  const pcs=intervals.map(iv=>(rootPc+iv)%12);
  const out=[];
  for(let s=0;s<4;s++){
    for(let f=0;f<=maxFret;f++){
      const midi=BASS_OPEN[s]+f;
      const pc=midi%12;
      const idx=pcs.indexOf(pc);
      if(idx>=0) out.push({string:s,fret:f,midi,degree:idx});
    }
  }
  return out;
}

/* ---------- 小工具 ---------- */
function $(sel,root){ return (root||document).querySelector(sel); }
function $all(sel,root){ return Array.from((root||document).querySelectorAll(sel)); }
function segButtons(el, items, onPick, initial){
  // items: [{key,label}]
  el.classList.add("seg");
  const btns={};
  items.forEach(it=>{
    const b=document.createElement("button");
    b.textContent=it.label;
    b.addEventListener("click",()=>{
      Object.values(btns).forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      onPick(it.key);
    });
    el.appendChild(b);
    btns[it.key]=b;
  });
  if(initial!==undefined && btns[initial]){ btns[initial].classList.add("on"); }
  return btns;
}
/* 播放和弦：type="block"|"arp", inst="piano"|"bass" */
function playChord(midis, mode, inst, bpm){
  bpm=bpm||100;
  const beat=60/bpm;
  const fn = inst==="bass"? AudioEngine.bass : AudioEngine.piano;
  const evs=[];
  if(mode==="arp"){
    midis.forEach((m,i)=>evs.push({time:i*beat*0.5, dur:beat*0.9, fn:(t)=>fn(m,t,beat*0.9)}));
    evs.push({time:midis.length*beat*0.5+beat*0.2, dur:beat*2,
      fn:(t)=>midis.forEach(m=>fn(m,t,beat*2,0.8))});
  }else{
    evs.push({time:0, dur:beat*2.2, fn:(t)=>midis.forEach(m=>fn(m,t,beat*2.2,0.85))});
  }
  Player.play(evs);
}

        l.a.classList.toggle("done",i<current);

      }
    }catch(e){}

})();

    {time:.3,dur:.5,fn:t=>AudioEngine.piano(79,t,.6)},
    {time:.45,dur:.8,fn:t=>AudioEngine.piano(84,t,.9)}
  ]);
  $("#gr-retry").addEventListener("click",()=>gOpen(lv));
  if(win&&next)$("#gr-next")&&$("#gr-next").addEventListener("click",()=>gOpen(next));
  $("#gr-map").addEventListener("click",gBackToMap);
}

/* ---------- 遊戲 1：指板尋寶 ---------- */
function playHunt(lv){
  const cfg=lv.cfg, pc=nameToPc(cfg.note);
  let occ=0;
  for(let s=0;s<4;s++)for(let f=0;f<=12;f++){ if((BASS_OPEN[s]+f)%12===pc)occ++; }
  const need=Math.min(cfg.count,occ);
  let timeLeft=cfg.time, found={}, done=false;
  $("#g-hud").innerHTML=`
    <div class="g-chip">目標：找出 <b>${need}</b> 個 <b style="font-size:17px">${cfg.note}</b></div>
    <div class="g-chip">進度 <b id="gh-found">0</b> / ${need}</div>
    <div class="g-chip time">⏱ <b id="gh-time">${timeLeft}</b> 秒</div>`;
  const arena=$("#g-arena");
  arena.innerHTML=`<div id="gh-board"></div><div class="g-msg" id="gh-msg">點指板上的位置——找到 ${cfg.note} 就會亮綠燈！</div>`;
  const fb=makeFretboard($("#gh-board"),{frets:12,fretW:58,showNames:cfg.hint?"natural":"none",
    onClick:(midi,s,f)=>{
      if(done)return;
      const key=s+"_"+f, msg=$("#gh-msg");
      if(midi%12===pc){
        if(found[key])return;
        found[key]=true;
        fb.highlight(Object.keys(found).map(k=>{
          const [ss,ff]=k.split("_").map(Number);
          return {string:ss,fret:ff,color:"#66d9a3",label:cfg.note};
        }));
        const n=Object.keys(found).length;
        $("#gh-found").textContent=n;
        msg.textContent=`✔ 找到了！（${n}/${need}）`; msg.className="g-msg ok";
        if(n>=need){
          done=true; clearInterval(timer);
          const ratio=timeLeft/cfg.time;
          gFinish(lv, ratio>=0.55?3:(ratio>=0.25?2:1));
        }
      }else{
        msg.textContent=`✘ 那是 ${midiToName(midi)}，扣 5 秒！`; msg.className="g-msg no";
        timeLeft=Math.max(0,timeLeft-5);
        $("#gh-time").textContent=timeLeft;
      }
    }});
  const timer=setInterval(()=>{
    if(done)return;
    timeLeft--;
    $("#gh-time").textContent=Math.max(0,timeLeft);
    if(timeLeft<=0){ done=true; clearInterval(timer); gFinish(lv,0); }
  },1000);
  gCleanup=()=>{ done=true; clearInterval(timer); };
}

/* ---------- 遊戲 2：耳朵大冒險 ---------- */
function playEar(lv){
  const cfg=lv.cfg;
  let qi=0, lives=3, wrong=0, cur=null, done=false;
  const results=[];
  $("#g-hud").innerHTML=`
    <div class="g-chip">第 <b id="ge-qi">1</b> / ${cfg.n} 題</div>
    <div class="g-chip g-hearts" id="ge-hearts"></div>
    <div class="g-dots" id="ge-dots"></div>`;
  function hearts(){ $("#ge-hearts").innerHTML="❤️".repeat(lives)+"🖤".repeat(3-lives); }
  function dots(){
    const d=$("#ge-dots"); d.innerHTML="";
    for(let i=0;i<cfg.n;i++){
      const s=document.createElement("span");
      if(i<results.length)s.className=results[i]?"ok":"no";
      else if(i===qi)s.className="now";
      d.appendChild(s);
    }
  }
  hearts(); dots();
  const arena=$("#g-arena");
  arena.innerHTML=`<div class="g-bigplay"><button class="btn" id="ge-play" style="font-size:17px;padding:14px 34px">🔊 播放題目</button>
    <button class="btn secondary" id="ge-again" style="margin-left:10px">↻ 再聽一次</button></div>
    <div class="quiz-opts" id="ge-opts" style="justify-content:center"></div>
    <div class="g-msg center" id="ge-msg"></div>`;
  const IV_LABEL={2:"大二度",4:"大三度",5:"完全四度",7:"完全五度",9:"大六度",12:"八度"};
  const CH_LABEL={maj:"大三和弦 😊",min:"小三和弦 😢",dom7:"屬七和弦 😏"};
  function makeQ(){
    if(cfg.mode==="pitch"){
      const a=52+Math.floor(Math.random()*16);
      const d=(3+Math.floor(Math.random()*7))*(Math.random()<0.5?1:-1);
      const b=a+d;
      return {play:()=>Player.play([
          {time:0,dur:.6,fn:t=>AudioEngine.piano(a,t,.7)},
          {time:.75,dur:.8,fn:t=>AudioEngine.piano(b,t,.9)}]),
        opts:["第二個音比較高","第二個音比較低"], ans:d>0?0:1};
    }
    if(cfg.mode==="scale"){
      const root=50+Math.floor(Math.random()*10);
      const maj=Math.random()<0.5;
      const ivs=(maj?SCALES.major.iv:SCALES.minor.iv).concat([12]);
      return {play:()=>Player.play(ivs.map((iv,i)=>({time:i*.33,dur:.3,fn:t=>AudioEngine.piano(root+iv,t,.38)}))),
        opts:["大調 😊 明亮","小調 😢 憂鬱"], ans:maj?0:1};
    }
    if(cfg.mode==="interval"){
      const semi=cfg.pool[Math.floor(Math.random()*cfg.pool.length)];
      const root=48+Math.floor(Math.random()*12);
      return {play:()=>Player.play([
          {time:0,dur:.55,fn:t=>AudioEngine.piano(root,t,.65)},
          {time:.7,dur:.8,fn:t=>AudioEngine.piano(root+semi,t,.95)}]),
        opts:cfg.pool.map(s=>IV_LABEL[s]), ans:cfg.pool.indexOf(semi)};
    }
    /* chord */
    const q=cfg.pool[Math.floor(Math.random()*cfg.pool.length)];
    const root=48+Math.floor(Math.random()*12);
    const ms=CHORDS[q].iv.map(iv=>root+iv);
    return {play:()=>Player.play([
        {time:0,dur:1.2,fn:t=>ms.forEach(m=>AudioEngine.piano(m,t,1.3,.85))},
        ...ms.map((m,i)=>({time:1.4+i*.28,dur:.3,fn:t=>AudioEngine.piano(m,t,.36)}))]),
      opts:cfg.pool.map(x=>CH_LABEL[x]), ans:cfg.pool.indexOf(q)};
  }
  function nextQ(){
    cur=makeQ();
    $("#ge-qi").textContent=qi+1;
    $("#ge-msg").textContent=""; $("#ge-msg").className="g-msg center";
    const box=$("#ge-opts"); box.innerHTML="";
    cur.opts.forEach((op,i)=>{
      const b=document.createElement("button");
      b.className="btn secondary"; b.textContent=op;
      b.addEventListener("click",()=>{
        if(done)return;
        const ok=i===cur.ans;
        results.push(ok);
        const msg=$("#ge-msg");
        if(ok){ msg.textContent="✔ 答對了！"; msg.className="g-msg center ok"; }
        else{ wrong++; lives--; hearts();
          msg.textContent=`✘ 正確答案：${cur.opts[cur.ans]}`; msg.className="g-msg center no"; }
        qi++; dots();
        if(lives<=0){ done=true; setTimeout(()=>gFinish(lv,0),900); return; }
        if(qi>=cfg.n){
          done=true;
          setTimeout(()=>gFinish(lv, wrong===0?3:(wrong===1?2:1)),900);
          return;
        }
        setTimeout(()=>{ nextQ(); cur.play(); },1000);
      });
      box.appendChild(b);
    });
    dots();
  }
  $("#ge-play").addEventListener("click",()=>cur&&cur.play());
  $("#ge-again").addEventListener("click",()=>cur&&cur.play());
  nextQ();
  gCleanup=()=>{ done=true; };
}

/* ---------- 遊戲 3：節奏跟拍 ---------- */
function playRhythm(lv){
  const cfg=lv.cfg, beat=60/cfg.bpm, step=beat/cfg.sub;
  const total=cfg.bars*4*cfg.sub;
  let expected=[], matched=[], running=false, doneFlag=false, endTimer=null;
  let stats={p:0,g:0}, combo=0;
  $("#g-hud").innerHTML=`
    <div class="g-chip">BPM <b>${cfg.bpm}</b></div>
    <div class="g-chip">${cfg.sub===1?"每拍點 1 下":"每拍點 2 下（八分音符）"}・${cfg.bars} 小節</div>
    <div class="g-chip">連擊 <b id="gr-combo">0</b></div>`;
  const arena=$("#g-arena");
  arena.innerHTML=`
    <div class="center" style="color:var(--muted);font-size:14px">按「開始」→ 先聽 1 小節前導拍（叩、叩、叩、叩）→ 跟著每個「叩」點大按鈕</div>
    <div class="g-bigplay"><button class="btn" id="gr-start" style="font-size:17px;padding:14px 40px">▶ 開始</button></div>
    <div class="g-bigplay"><button class="g-tap" id="gr-tap">🥁 點我跟拍</button></div>
    <div class="g-feedback" id="gr-fb"></div>`;
  function start(){
    if(running)return;
    running=true; expected=[]; matched=[]; stats={p:0,g:0}; combo=0;
    $("#gr-combo").textContent="0"; $("#gr-fb").textContent="";
    const c=AudioEngine.ensure();
    const t0=c.currentTime+0.25;
    /* 前導 1 小節 */
    for(let b=0;b<4;b++) AudioEngine.click(t0+b*beat, b===0);
    const play0=t0+4*beat;
    for(let i=0;i<total;i++){
      const t=play0+i*step;
      expected.push(t); matched.push(false);
      const onBeat=i%cfg.sub===0;
      AudioEngine.click(t, onBeat && (i/cfg.sub)%4===0);
      if(onBeat){
        const bi=(i/cfg.sub)%4;
        AudioEngine.drum(t, (bi===0||bi===2)?"kick":"snare");
      }
    }
    const endT=(play0+total*step+0.4-c.currentTime)*1000;
    endTimer=setTimeout(()=>{
      if(doneFlag)return;
      doneFlag=true; running=false;
      const missed=matched.filter(m=>!m).length;
      const score=(stats.p+stats.g*0.6)/total;
      let stars=0;
      if(missed<=total*0.1 && score>=0.85)stars=3;
      else if(score>=0.65)stars=2;
      else if(score>=0.4)stars=1;
      gFinish(lv,stars);
    }, endT);
  }
  function tap(){
    AudioEngine.ensure();
    if(!running)return;
    const t=AudioEngine.now();
    let best=-1,bestD=1e9;
    expected.forEach((et,i)=>{
      if(matched[i])return;
      const d=Math.abs(t-et);
      if(d<bestD){bestD=d;best=i;}
    });
    const fb=$("#gr-fb");
    if(best>=0 && bestD<=0.09){ matched[best]=true; stats.p++; combo++;
      fb.textContent="PERFECT！"; fb.style.color="var(--green)"; }
    else if(best>=0 && bestD<=0.18){ matched[best]=true; stats.g++; combo++;
      fb.textContent="GOOD"; fb.style.color="var(--accent2)"; }
    else{ combo=0; fb.textContent=bestD>0.3?"…等節拍來再點":"MISS"; fb.style.color="var(--red)"; }
    $("#gr-combo").textContent=combo;
  }
  $("#gr-start").addEventListener("click",start);
  $("#gr-tap").addEventListener("pointerdown",e=>{e.preventDefault();tap();});
  gCleanup=()=>{ doneFlag=true; running=false; if(endTimer)clearTimeout(endTimer); };
}

gRenderStats();
gRenderMap();

</script>
